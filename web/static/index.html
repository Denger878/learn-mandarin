<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>learn mandarin</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>learn mandarin</h1>
  <p class="stats" id="stats"></p>
</header>

<nav class="tabs" id="tabs">
  <button class="tab" data-panel="import">input text</button>
  <button class="tab" data-panel="learn">learn new words</button>
  <button class="tab" data-panel="review">review known words</button>
</nav>

<main>
  <section class="panel" id="panel-import">
    <form id="import-form">
      <textarea id="import-text" rows="10" placeholder="paste Chinese text here" spellcheck="false"></textarea>
      <div class="row">
        <label for="import-source">source</label>
        <select id="import-source">
          <option value="dm">dm</option>
          <option value="gc">gc</option>
          <option value="discovery">discovery</option>
          <option value="other">other</option>
        </select>
        <button type="submit">import</button>
      </div>
    </form>
    <p class="message" id="import-message"></p>
  </section>

  <section class="panel" id="panel-learn">
    <div class="drill" data-mode="learn">
      <p class="count"></p>
      <p class="empty"></p>
      <div class="card" hidden>
        <p class="hanzi"></p>
        <form class="guess-form">
          <input class="guess" type="text" placeholder="type the pinyin, no tones" autocomplete="off" spellcheck="false">
          <button type="submit">check</button>
        </form>
        <div class="result" hidden>
          <p class="verdict"></p>
          <p class="answer"></p>
          <p class="meaning"></p>
          <form class="meaning-form" hidden>
            <input class="meaning-input" type="text" placeholder="add the English meaning" autocomplete="off">
            <button type="submit">save</button>
          </form>
          <p class="note"></p>
          <div class="row">
            <button class="next">next word</button>
            <button class="master" hidden>mark mastered</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="panel" id="panel-review">
    <div class="drill" data-mode="review">
      <p class="count"></p>
      <p class="empty"></p>
      <div class="card" hidden>
        <p class="hanzi"></p>
        <form class="guess-form">
          <input class="guess" type="text" placeholder="type the pinyin, no tones" autocomplete="off" spellcheck="false">
          <button type="submit">check</button>
        </form>
        <div class="result" hidden>
          <p class="verdict"></p>
          <p class="answer"></p>
          <p class="meaning"></p>
          <form class="meaning-form" hidden>
            <input class="meaning-input" type="text" placeholder="add the English meaning" autocomplete="off">
            <button type="submit">save</button>
          </form>
          <p class="note"></p>
          <div class="row">
            <button class="next">next word</button>
            <button class="master" hidden>mark mastered</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
